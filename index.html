<style>

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 65px)}aside{border-right:1px solid var(--line);padding:16px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;background:#0d1727}
main{padding:22px;max-width:1200px;width:100%;margin:auto}.navbtn{display:block;width:100%;text-align:left;margin:5px 0;background:transparent}.navbtn.active{background:var(--panel2);border-color:var(--accent)}.small{font-size:.9rem;color:var(--muted)}h1{font-size:clamp(1.6rem,3vw,2.4rem);line-height:1.15}h2{font-size:1.3rem}h3{font-size:1.02rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;margin:12px 0}.stat{font-size:1.8rem;font-weight:800;color:var(--accent)}.bar{height:8px;background:#25354c;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:var(--accent)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pill{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}.lesson{border-left:3px solid var(--accent);padding:5px 0 5px 14px}.callout{border:1px solid #6c5b2d;background:#292416;padding:12px;border-radius:12px;color:#ffedbd}.good{color:var(--accent)}textarea,input,select{width:100%;background:#0b1423;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}textarea{min-height:140px;resize:vertical}.question{padding:12px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.choice{display:block;padding:5px 0}.hide{display:none}.slide{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:radial-gradient(circle at top right,#23445a,#121d30 65%);border-radius:16px;padding:24px}.slide h2{font-size:1.7rem;color:var(--accent)}.slide p{max-width:700px;margin:0 auto}.timer{font-size:2rem;font-weight:800}.flash{min-height:120px;display:grid;place-items:center;text-align:center;font-size:1.2rem}.footer{color:var(--muted);font-size:.85rem;padding:25px 0}.lesson-table{width:100%;border-collapse:collapse;margin:12px 0;background:#0d1727}.lesson-table th,.lesson-table td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}.lesson-table th{background:#1b3046;color:var(--accent)}.flowline{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:16px;background:#0d1727;border:1px solid var(--line);border-radius:14px}.flowstep{padding:10px 13px;border:1px solid #4b7184;background:#183247;border-radius:10px;animation:floatIn .5s both}.arrow{color:var(--accent);font-weight:800}@keyframes floatIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.slide{animation:floatIn .35s ease-out}.search-results{display:grid;gap:8px}.tag{display:inline-block;background:#1e3b4a;color:#a8fff1;padding:3px 8px;border-radius:7px;font-size:.8rem}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{position:relative;top:auto;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:14px}.split{grid-template-columns:1fr}header{position:relative}}

<header><div class="brand">🛡️ CYBERSECURITY <span>ACADEMY</span><div class="small">Your personal beginner-to-job-readiness learning lab</div></div>
<div class="row"><button onclick="showPage('dashboard')">Dashboard</button><button onclick="showPage('notes')">My Notebook</button><button onclick="showPage('search')">🔎 Search lessons</button><button onclick="installAcademy()">⬇ Install</button><button onclick="exportBackup()">Export backup</button></div></header>
<div class="layout"><aside>

<script>
const modules = [{"title": "Month 1 — Computer Fundamentals & Digital Safety", "topics": [{"title": "Computer basics", "notes": "A computer receives input, processes data using instructions, stores data, and produces output. Main stages: Input → Processing → Storage → Output."}, {"title": "Hardware and software", "notes": "Hardware is the physical part (keyboard, screen, RAM, SSD). Software is the instructions/programs (Windows, browser, Python)."}, {"title": "Files and operating systems", "notes": "An operating system manages hardware, files, users, applications, and permissions. Learn folders, file extensions, updates, and backups."}, {"title": "Accounts and safe habits", "notes": "Use unique passwords, multi-factor authentication (MFA), screen lock, updates, backups, and cautious link handling."}]}, {"title": "Month 2 — Networking Foundations", "topics": [{"title": "Network basics", "notes": "A network connects devices so they can exchange data. LAN covers a local area; WAN covers a wide area. The Internet is a global network of networks."}, {"title": "IP and MAC addresses", "notes": "An IP address helps route data between networks. A MAC address identifies a network interface on a local network. They serve different purposes."}, {"title": "DNS, DHCP, ports", "notes": "DNS maps domain names to IP addresses. DHCP can assign network settings automatically. Ports help a device direct traffic to the right service."}, {"title": "TCP, UDP, HTTP(S)", "notes": "TCP provides ordered, reliable delivery; UDP has lower overhead but no built-in delivery guarantee. HTTPS protects web traffic in transit using TLS."}]}, {"title": "Month 3 — Linux, Windows & Command Line", "topics": [{"title": "Linux basics", "notes": "Linux is an operating-system family used on servers and security tools. Practise only in your own system or authorised lab."}, {"title": "Files and permissions", "notes": "Learn paths, directories, read/write/execute permissions, users, groups, and least privilege."}, {"title": "Windows security", "notes": "Understand updates, Defender, firewall, users, event logs, and basic system settings."}, {"title": "Command-line habits", "notes": "Use commands carefully. Understand a command before running it; avoid commands copied from unknown sources."}]}, {"title": "Month 4 — Python Foundations", "topics": [{"title": "Core syntax", "notes": "Learn variables, strings, numbers, booleans, input/output, operators, and type conversion."}, {"title": "Decisions and loops", "notes": "if/elif/else selects a path. for and while repeat work. Use clear indentation and test boundary cases."}, {"title": "Collections and functions", "notes": "Lists hold ordered items, dictionaries map keys to values, and functions package reusable steps."}, {"title": "Files and errors", "notes": "Read and write practice files, handle exceptions, and never collect or transmit real passwords or private data in beginner projects."}]}, {"title": "Month 5 — Security Fundamentals", "topics": [{"title": "CIA triad", "notes": "Confidentiality limits access; integrity protects accuracy; availability keeps systems usable."}, {"title": "Threats and risk", "notes": "A threat could cause harm, a vulnerability is a weakness, and risk combines likelihood and impact."}, {"title": "Authentication and access", "notes": "Authentication checks who you are; authorization checks what you may do. Use MFA and least privilege."}, {"title": "Security controls", "notes": "Preventive, detective, and corrective controls reduce the chance or impact of incidents."}]}, {"title": "Month 6 — Defensive Security & Logs", "topics": [{"title": "SOC overview", "notes": "A Security Operations Center monitors alerts, investigates suspicious activity, and coordinates response."}, {"title": "Logs", "notes": "Logs record events. Learn timestamps, usernames, source IPs, event types, and context using synthetic sample data."}, {"title": "Incident response", "notes": "A common cycle is preparation, detection/analysis, containment, eradication/recovery, and lessons learned."}, {"title": "SIEM concepts", "notes": "A SIEM collects and correlates logs. Learn alert triage and false-positive handling using training data."}]}, {"title": "Month 7 — Web & Application Security", "topics": [{"title": "How websites work", "notes": "Browsers and servers exchange HTTP requests and responses. HTML structures pages; CSS styles them; JavaScript adds behaviour."}, {"title": "OWASP awareness", "notes": "Study common web risks conceptually: access-control failures, injection, insecure design, misconfiguration, and authentication weaknesses."}, {"title": "Secure coding", "notes": "Validate inputs, encode output, use parameterized queries, protect secrets, and keep dependencies updated."}, {"title": "Safe practice", "notes": "Use intentionally vulnerable training apps in an isolated lab, not real websites or other people's accounts."}]}, {"title": "Month 8 — Cloud Fundamentals", "topics": [{"title": "Cloud concepts", "notes": "Cloud services provide computing, storage, databases, and networking on demand."}, {"title": "Shared responsibility", "notes": "The provider secures parts of the cloud platform; customers still configure identities, data, network access, and workloads correctly."}, {"title": "Cloud identity", "notes": "Use least privilege, MFA, role-based access, short-lived credentials, and avoid public exposure of sensitive storage."}, {"title": "Cloud monitoring", "notes": "Review audit logs, alerts, backups, configuration checks, and budget limits."}]}, {"title": "Month 9 — Network Analysis & System Hardening", "topics": [{"title": "Packet analysis", "notes": "A packet capture can help explain protocols and connections. Inspect only your own traffic or approved training captures."}, {"title": "Firewall concepts", "notes": "Firewalls allow or block traffic according to rules. Keep rules narrow and document why each rule exists."}, {"title": "Hardening", "notes": "Remove unused services, patch software, disable unnecessary accounts, back up data, and review permissions."}, {"title": "Vulnerability management", "notes": "Identify assets, assess findings, prioritise by severity and context, remediate, then verify."}]}, {"title": "Month 10 — Containers, DevSecOps & Automation", "topics": [{"title": "Containers", "notes": "Containers package an application and its dependencies. Learn images, containers, registries, and isolation concepts."}, {"title": "Secure development", "notes": "Shift security checks earlier: code review, dependency checks, secret scanning, and tests."}, {"title": "Automation", "notes": "Python can parse synthetic logs, format reports, and automate repetitive defensive checks."}, {"title": "Supply chain", "notes": "Use trusted sources, pin and update dependencies, verify downloads, and protect build credentials."}]}, {"title": "Month 11 — Portfolio & Capstone", "topics": [{"title": "Project 1: log analyser", "notes": "Use a made-up log file; count failed logins by user/IP and generate a simple report. Do not monitor people without permission."}, {"title": "Project 2: security checklist", "notes": "Create a checklist for laptop updates, MFA, backups, firewall, and account permissions."}, {"title": "Project 3: phishing awareness", "notes": "Build a safe educational checker that explains warning signs from example URLs without visiting or attacking them."}, {"title": "Documentation", "notes": "Include purpose, scope, tools, test data, screenshots only if available, results, limitations, and ethical boundaries."}]}, {"title": "Month 12 — Job Preparation & Review", "topics": [{"title": "Entry-level roles", "notes": "Explore IT support, service desk, network support, security internship, SOC analyst L1, and junior security analyst roles."}, {"title": "Resume and GitHub", "notes": "Show honest skills and projects, readable documentation, and what you personally built. Never claim certifications you do not have."}, {"title": "Interview practice", "notes": "Explain DNS, IP, TCP/UDP, CIA triad, MFA, logs, phishing warning signs, and one project in simple words."}, {"title": "Final review", "notes": "Revise weak topics, complete capstone, practise labs legally, and make a realistic ongoing learning plan."}]}];
const hindiNotes = {"Computer basics": "Computer data leta hai, us par instructions ke hisaab se kaam karta hai, zaroorat par save karta hai, aur result deta hai. Iske chaar steps hain: input, processing, storage aur output.", "Hardware and software": "Hardware computer ke physical parts hote hain, jaise keyboard, screen aur RAM. Software programs hote hain, jaise Windows, browser aur Python.", "Files and operating systems": "Operating system computer ke hardware, files, users aur applications ko manage karta hai. Files ko sahi folders mein rakhein, updates karein aur important data ka backup banayein.", "Accounts and safe habits": "Har account ke liye alag strong password rakhein, MFA on karein, screen lock lagayein, updates karein aur unknown links se savdhaan rahein.", "Network basics": "Network devices ko connect karta hai taaki woh data share kar sakein. LAN chhote local area ka network hai, aur WAN bade area ko cover karta hai. Internet bahut saare networks ka global connection hai.", "IP and MAC addresses": "IP address network par data ko sahi jagah pahunchane mein madad karta hai. MAC address local network par network interface ko identify karta hai. Dono ka kaam alag hai.", "DNS, DHCP, ports": "DNS domain name ko IP address se match karta hai. DHCP device ko network settings automatically de sakta hai. Ports traffic ko sahi service tak pahunchane mein madad karte hain.", "TCP, UDP, HTTP(S)": "TCP data ko order mein aur reliable tareeke se pahunchata hai. UDP mein overhead kam hota hai lekin delivery ki guarantee nahi hoti. HTTPS, TLS ke through web traffic ko transit mein protect karta hai.", "Linux basics": "Linux operating system ka ek family hai jo servers aur security tools mein use hota hai. Practice sirf apne computer ya authorised lab mein karein.", "Files and permissions": "File path batata hai file kahan hai. Permissions decide karti hain ki kaun file read, write ya execute kar sakta hai. Sirf zaroori access dena achhi security hai.", "Windows security": "Windows ko updated rakhein. Windows Security/Defender, firewall, user accounts aur event logs ke basic uses samjhein.", "Command-line habits": "Command chalane se pehle samjhein ki woh kya karegi. Unknown source se copy ki hui commands ko bina samjhe run na karein.", "Core syntax": "Python mein variables values rakhte hain. Strings text, numbers numerical values aur booleans True ya False ko represent karte hain. Input, output aur operators se basic programs bante hain.", "Decisions and loops": "if, elif aur else conditions ke basis par decision lete hain. for aur while loops kaam repeat karte hain. Python mein indentation bahut important hai.", "Collections and functions": "List ordered items rakhti hai. Dictionary key aur value ka pair rakhti hai. Function reusable code ka block hota hai.", "Files and errors": "Practice files ko read aur write karna seekhein. Errors ko safely handle karein. Real passwords ya private information ko beginner project mein collect ya send na karein.", "CIA triad": "CIA triad ke teen parts hain: Confidentiality yaani data sirf authorised log dekhein; Integrity yaani data sahi rahe; Availability yaani system zaroorat par available ho.", "Threats and risk": "Threat woh cheez hai jo nuksaan kar sakti hai. Vulnerability ek weakness hai. Risk mein nuksaan hone ki possibility aur uska impact dono dekhe jaate hain.", "Authentication and access": "Authentication check karta hai ki aap kaun hain. Authorization check karta hai ki aapko kya karne ki permission hai. MFA aur least privilege security ko behtar banate hain.", "Security controls": "Preventive controls problem ko rokne ki koshish karte hain. Detective controls problem ko pehchante hain. Corrective controls incident ke baad recovery mein madad karte hain.", "SOC overview": "SOC yaani Security Operations Center security alerts monitor karta hai, suspicious activity investigate karta hai aur incident response coordinate karta hai.", "Logs": "Logs system par hone wale events ka record hote hain. Unmein time, username, source IP aur event type ho sakta hai. Sirf ek line dekhkar conclusion na nikalein; context bhi zaroori hai.", "Incident response": "Incident response mein preparation, detection aur analysis, containment, removal, recovery aur baad mein lessons seekhna shamil ho sakta hai.", "SIEM concepts": "SIEM kai systems ke logs ko ek jagah collect aur correlate karta hai. Analyst alerts check karta hai aur false positives ko samajhne ki koshish karta hai.", "How websites work": "Browser server ko HTTP request bhejta hai aur server response deta hai. HTML page ka structure banata hai, CSS design karta hai aur JavaScript interaction add karta hai.", "OWASP awareness": "OWASP web application ke common security risks samajhne mein madad karta hai, jaise access control ki problem, injection aur galat configuration.", "Secure coding": "Input validate karein, output ko sahi encode karein, database ke liye parameterized queries use karein, secrets ko protect karein aur dependencies update karein.", "Safe practice": "Web security ki practice intentionally vulnerable training apps aur isolated lab mein karein. Real websites ya kisi aur ke account par test na karein.", "Cloud concepts": "Cloud services internet ke through computing, storage, databases aur networking provide karti hain.", "Shared responsibility": "Cloud provider platform ke kuch hisson ko secure karta hai. Customer ko identity, data, network access aur workload ki sahi configuration ka dhyan rakhna hota hai.", "Cloud identity": "Least privilege, MFA, roles aur short-lived credentials use karein. Sensitive storage ko public access na dein.", "Cloud monitoring": "Audit logs, alerts, backups, configuration checks aur budget limits ko regularly review karein.", "Packet analysis": "Packet capture network communication samajhne mein madad karta hai. Sirf apna traffic ya approved training capture inspect karein.", "Firewall concepts": "Firewall rules ke hisaab se network traffic allow ya block karta hai. Rules ko narrow rakhein aur har rule ka reason document karein.", "Hardening": "Unused services hataayein, software patch karein, unnecessary accounts disable karein, backups banayein aur permissions review karein.", "Vulnerability management": "Assets identify karein, findings ka risk samjhein, priority set karein, issue fix karein aur phir verify karein.", "Containers": "Container application aur uski dependencies ko package karta hai. Images, containers, registries aur isolation ke concepts seekhein.", "Secure development": "Security ko development ke shuru se include karein: code review, dependency checks, secrets scanning aur tests.", "Automation": "Python synthetic logs ko read karne, reports banane aur repeat hone wale defensive tasks automate karne mein madad kar sakta hai.", "Supply chain": "Trusted sources use karein, dependencies update aur pin karein, downloads verify karein aur build credentials protect karein.", "Project 1: log analyser": "Ek fake log file use karke failed login events ko user ya IP ke hisaab se count karein aur simple report banayein. Bina permission kisi ko monitor na karein.", "Project 2: security checklist": "Laptop security ke liye updates, MFA, backups, firewall aur account permissions ki checklist banayein.", "Project 3: phishing awareness": "Example URLs aur messages se warning signs samjhane wala educational checker banayein. Suspicious link ko kholna ya attack karna zaroori nahi hai.", "Documentation": "Project ka purpose, scope, tools, test data, results, limitations aur ethical rules likhein. Sirf wahi claim karein jo aapne khud kiya ho.", "Entry-level roles": "IT support, service desk, network support, security internship, SOC analyst L1 aur junior security analyst jaise entry-level roles explore karein.", "Resume and GitHub": "Apni real skills aur projects ko clearly dikhayein. Project ka documentation readable rakhein. Aisi certification ka claim na karein jo aapke paas nahi hai.", "Interview practice": "DNS, IP, TCP aur UDP, CIA triad, MFA, logs aur phishing ke warning signs ko simple words mein samjhana practise karein. Apna ek project bhi explain karein.", "Final review": "Weak topics revise karein, capstone project complete karein, authorised labs practise karein aur aage ka realistic learning plan banayein."};
const state = JSON.parse(localStorage.getItem('cyberAcademyState')||'{}');
state.done ||= {}; state.notes ||= {}; state.quiz ||= {}; state.currentMonth ??= 0; state.currentTopic ??= 0;
let page='dashboard', speech=null, slideTimer=null, slideIndex=0;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('cyberAcademyState',JSON.stringify(state));}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function totalLessons(){return modules.reduce((n,m)=>n+m.topics.length,0)}
function completed(){return Object.values(state.done).filter(Boolean).length}
function progress(){return Math.round(completed()/totalLessons()*100)}
function key(m,t){return m+'-'+t}
function nav(){ $('monthNav').innerHTML=modules.map((m,i)=>`<button class="navbtn ${page==='month'&&state.currentMonth===i?'active':''}" onclick="openMonth(${i})">${i+1}. ${esc(m.title.replace(/^Month \\d+ — /,''))}<div class="small">${m.topics.filter((x,j)=>state.done[key(i,j)]).length}/${m.topics.length} lessons</div></button>`).join('');}
function showPage(p){page=p;nav();render();}
function openMonth(i){state.currentMonth=i;state.currentTopic=0;save();page='month';nav();render();}
function openTopic(i){state.currentTopic=i;save();page='lesson';render();}
function render(){
 const app=$('app'); nav();
 if(page==='dashboard'){app.innerHTML=`<h1>Welcome to your Cybersecurity Academy</h1><p class="small">Learn one small lesson at a time. Your progress and notes are saved in this browser on this device.</p>
 <div class="grid"><div class="card"><div class="small">Overall progress</div><div class="stat">${progress()}%</div><div class="bar"><i style="width:${progress()}%"></i></div><p>${completed()} of ${totalLessons()} lessons marked complete</p></div>
 <div class="card"><div class="small">Daily target</div><div class="stat">2 hours</div><p>30m learn · 45m practice · 25m notes · 20m recall</p></div>
 <div class="card"><div class="small">Your next step</div><h3>${esc(modules[state.currentMonth].topics[state.currentTopic].title)}</h3><button class="primary" onclick="page='lesson';render()">Continue lesson</button></div></div>
 <div class="card"><h2>Learning path</h2><div class="grid">${modules.map((m,i)=>`<div class="card"><span class="tag">Month ${i+1}</span><h3>${esc(m.title.split('—')[1]||m.title)}</h3><div class="bar"><i style="width:${Math.round(m.topics.filter((x,j)=>state.done[key(i,j)]).length/m.topics.length*100)}%"></i></div><p class="small">${m.topics.filter((x,j)=>state.done[key(i,j)]).length}/${m.topics.length} completed</p><button onclick="openMonth(${i})">Open month</button></div>`).join('')}</div></div>
 <div class="card"><h2>Study anywhere</h2><p>After opening the hosted academy once, the service worker can cache the core website for offline use. On a phone, use your browser menu to add it to your home screen. Notes and progress are stored in this browser/device; export a backup before switching devices.</p></div><div class="callout"><b>Ethical practice:</b> only practise on your own devices, your own files, or authorised training labs. This academy teaches defence and safe learning.</div>`;
 } else if(page==='month'){let m=modules[state.currentMonth];app.innerHTML=`<h1>${esc(m.title)}</h1><p class="small">Select a lesson. Read the notes, practise, then mark it complete.</p>${m.topics.map((t,i)=>`<div class="card row" style="justify-content:space-between"><div><span class="pill">Lesson ${i+1}</span><h3>${esc(t.title)}</h3><div class="small">${esc(t.notes)}</div></div><div class="row"><span>${state.done[key(state.currentMonth,i)]?'✅':'○'}</span><button onclick="openTopic(${i})">Study</button></div></div>`).join('')}<button onclick="showPage('dashboard')">Back to dashboard</button>`;
 } else if(page==='lesson'){let m=state.currentMonth,t=state.currentTopic,topic=modules[m].topics[t],k=key(m,t);app.innerHTML=`<p class="small">MONTH ${m+1} · LESSON ${t+1} OF ${modules[m].topics.length}</p><h1>${esc(topic.title)}</h1>
 <div class="card"><h2>Easy explanation</h2><p>${esc(topic.notes)}</p><h3>Animated visual map</h3><div class="flowline">${visualFor(topic.title,topic.notes)}</div><h3>Quick understanding table</h3>${lessonTable(topic.title,topic.notes)}<h3>Explain it in simple Hindi</h3><p id="hindiText">${esc(hindiExplain(topic.title,topic.notes))}</p><div class="row"><button class="primary" onclick="speakText($('hindiText').innerText)">🔊 सुनें / Listen in Hindi</button><button onclick="stopSpeech()">Stop audio</button><button onclick="showPage('video')">Open animated narrated lesson</button><button onclick="window.print()">Print lesson</button></div></div>
 <div class="card"><h2>Notebook notes</h2><p>Write the definition, one example, and what you learned in your own words.</p><textarea id="lessonNote" placeholder="Write your notes here...">${esc(state.notes[k]||'')}</textarea><div class="row"><button class="primary" onclick="saveLessonNote(${m},${t})">Save notes</button><button onclick="downloadLessonNote(${m},${t})">Download this note</button></div></div>
 <div class="card"><h2>Practice task</h2><p>${esc(practiceFor(m,t))}</p><label class="choice"><input type="checkbox" id="doneBox" ${state.done[k]?'checked':''} style="width:auto"> I completed this lesson and practice</label><button class="primary" onclick="markDone(${m},${t})">Save completion</button></div>
 <div class="row"><button onclick="prevTopic()">← Previous</button><button class="primary" onclick="nextTopic()">Next lesson →</button><button onclick="showPage('quiz')">Take quiz</button></div>`;
 } else if(page==='notes'){app.innerHTML=`<h1>My Notebook</h1><p class="small">Your notes stay in this browser. Export a backup before changing device or clearing browser data.</p><div class="card"><h2>Quick note</h2><input id="noteTitle" placeholder="Note title"><textarea id="quickNote" placeholder="Write definitions, examples, commands, questions..."></textarea><button class="primary" onclick="saveQuickNote()">Save quick note</button></div><h2>Saved lesson notes</h2>${Object.entries(state.notes).filter(([k,v])=>v).map(([k,v])=>`<div class="card"><h3>${esc(noteLabel(k))}</h3><p>${esc(v).slice(0,500)}</p><button onclick="editNote('${k}')">Edit</button></div>`).join('')||'<p class="small">No notes saved yet. Open a lesson and write your first notes.</p>'}<div class="card"><h2>Notebook method</h2><ol><li>Definition in simple English</li><li>Explain in your own words</li><li>Example or diagram</li><li>What can go wrong?</li><li>Three questions for revision</li></ol></div>`;
 } else if(page==='video'){app.innerHTML=`<h1>Hindi audio + narrated lessons</h1><p class="small">This page turns each lesson into a slide-style mini lesson and reads the Hindi explanation aloud using your browser's available Hindi voice. It does not need another learning platform, but audio availability depends on your browser/device.</p><div class="card"><label>Choose lesson</label><select id="videoPick" onchange="setSlide(0)">${modules.map((m,mi)=>m.topics.map((t,ti)=>`<option value="${mi}-${ti}">Month ${mi+1}: ${esc(t.title)}</option>`).join('')).join('')}</select><div class="slide" id="slide"><span class="tag">SLIDE 1</span><h2>Welcome</h2><p>Choose a lesson above and press Start narrated lesson.</p></div><div class="row" style="justify-content:center;margin-top:12px"><button class="primary" onclick="startNarrated()">▶ Start narrated lesson</button><button onclick="prevSlide()">← Previous slide</button><button onclick="nextSlide()">Next slide →</button><button onclick="stopSpeech()">Stop audio</button></div><p id="slideCount" class="small" style="text-align:center"></p></div><div class="card"><h2>Hindi voice settings</h2><p>Try Chrome or Edge on a device with Hindi text-to-speech installed. If no Hindi voice appears, the lesson text still works; your browser/device voice settings control available voices.</p><button onclick="listVoices()">Check available voices</button><p id="voiceInfo" class="small"></p></div>`;
 } else if(page==='quiz'){app.innerHTML=`<h1>Quiz Centre</h1><p>Try these beginner questions without looking at notes. Select answers and check your score.</p><form id="quizForm" onsubmit="return gradeQuiz(event)"><div id="quizQuestions"></div><button class="primary" type="submit">Check my answers</button></form><div id="quizResult"></div>`;
 const qs=[['Which is hardware?',['Python','Keyboard','Windows'],1,'Hardware is a physical part you can touch.'],['What does DNS help do?',['Map domain names to IP addresses','Charge a laptop','Create a password'],0,'DNS helps find the IP address for a domain name.'],['What does MFA mean?',['More file access','Multi-factor authentication','Main firewall application'],1,'MFA uses more than one kind of proof to sign in.'],['Which is the safest practice target?',['A random public website','A friend’s account','Your own lab with permission'],2,'Practise only on your own systems or authorised labs.'],['What is a log?',['A record of an event','A type of keyboard','A password'],0,'Logs record system or application events.']];
 $('quizQuestions').innerHTML=qs.map((q,i)=>`<div class="question"><b>${i+1}. ${q[0]}</b>${q[1].map((c,j)=>`<label class="choice"><input style="width:auto" type="radio" name="q${i}" value="${j}" required> ${esc(c)}</label>`).join('')}</div>`).join('');window.quizData=qs;
 } else if(page==='flashcards'){let cards=[['Hardware','Physical parts of a computer you can touch.'],['Software','Programs and instructions used by a computer.'],['IP address','A logical address used to route network traffic.'],['DNS','Maps domain names to IP addresses.'],['MFA','Uses more than one type of sign-in proof.'],['Vulnerability','A weakness that could be misused.'],['Least privilege','Give only the access needed for the task.'],['Log','A record of an event.'],['Patch','An update that fixes bugs or security issues.'],['CIA triad','Confidentiality, Integrity, Availability.']];window.flashcards=cards;window.flashIndex=0;app.innerHTML=`<h1>Flashcards</h1><p class="small">Test your recall. Try to answer before revealing the back.</p><div class="card flash" id="flashText">Hardware</div><div class="row" style="justify-content:center"><button onclick="flipFlash()">Reveal answer</button><button onclick="moveFlash(-1)">Previous</button><button class="primary" onclick="moveFlash(1)">Next card</button></div><p id="flashCount" class="small" style="text-align:center"></p>`;showFlash();
 } else if(page==='lab'){app.innerHTML=`<h1>Safe Practice Lab</h1><p class="small">These exercises use only example data in this page. They do not scan networks or contact any system.</p><div class="card"><h2>Lab 1: Spot a suspicious message</h2><p>Example: “Your account will close now. Click this unfamiliar link and enter your password.”</p><p><b>Warning signs:</b> urgency, unexpected link, request for password, unclear sender.</p><label>Write two warning signs you spotted</label><textarea id="lab1" placeholder="My answer...">${esc(state.lab1||'')}</textarea><button class="primary" onclick="state.lab1=$('lab1').value;save();alert('Lab answer saved in this browser.')">Save answer</button></div><div class="card"><h2>Lab 2: Read a sample log</h2><pre style="white-space:pre-wrap;background:#08101c;padding:12px;border-radius:10px">2026-01-10 09:01 user=alex event=login result=success
2026-01-10 09:02 user=alex event=login result=failed
2026-01-10 09:03 user=alex event=login result=failed
2026-01-10 09:04 user=alex event=login result=failed</pre><p>Question: How many failed login events are shown?</p><input id="lab2" placeholder="Type a number" value="${esc(state.lab2||'')}"><button class="primary" onclick="state.lab2=$('lab2').value;save();alert(state.lab2.trim()==='3'?'Correct! There are 3 failed events.':'Try counting rows marked result=failed.')">Check and save</button></div><div class="callout">Safety boundary: no real-world scanning, password collection, account access, or testing systems without written permission.</div>`;
 } else if(page==='glossary'){let words=[['Asset','Something valuable that needs protection.'],['Authentication','Checking who you are.'],['Authorization','Checking what you are allowed to do.'],['Availability','Systems/data are usable when needed.'],['CIA triad','Confidentiality, Integrity, Availability.'],['DNS','System that maps domain names to IP addresses.'],['Firewall','Filters network traffic using rules.'],['Integrity','Keeping information accurate and unaltered without permission.'],['IP address','Logical address used to route network traffic.'],['Log','Record of an event.'],['MFA','Multi-factor authentication.'],['Patch','Update that fixes a bug or security issue.'],['Phishing','Trick message designed to steal information or cause unsafe action.'],['Risk','Likelihood and impact of potential harm.'],['Threat','Something that could cause harm.'],['Vulnerability','A weakness that could be misused.']];app.innerHTML=`<h1>A–Z Glossary</h1><input id="glossSearch" placeholder="Search a word..." oninput="filterGlossary()" /><div id="glossItems">${words.map(w=>`<div class="card gloss"><h3>${w[0]}</h3><p>${w[1]}</p></div>`).join('')}</div>`;
 } else if(page==='resources'){app.innerHTML=`<h1>Learning resources</h1><p class="small">The academy's lesson notes are available here. These links are optional for extra official practice; you do not need them to begin this course.</p><div class="grid">${[['Python official tutorial','https://docs.python.org/3/tutorial/','Python programming basics'],['Cisco Networking Academy','https://www.netacad.com/','Networking foundations'],['Linux Journey','https://linuxjourney.com/','Linux basics'],['Microsoft Learn','https://learn.microsoft.com/training/','Windows and cloud fundamentals'],['OWASP Top 10','https://owasp.org/www-project-top-ten/','Web application security awareness'],['NIST NICE Framework','https://www.nist.gov/itl/applied-cybersecurity/nice/nice-framework-resource-center','Cybersecurity career roles'],['TryHackMe','https://tryhackme.com/','Authorised training labs']].map(r=>`<div class="card"><h3>${esc(r[0])}</h3><p>${esc(r[2])}</p><a href="${r[1]}" target="_blank" rel="noopener" style="color:var(--accent)">Open resource ↗</a></div>`).join('')}</div>`;
 } else if(page==='search'){app.innerHTML=`<h1>Search the whole academy</h1><p class="small">Search all course lessons by topic or keyword.</p><div class="card"><input id="academySearch" placeholder="Try: Python, DNS, cloud, logs, phishing..." oninput="runAcademySearch()" autofocus><div id="academySearchResults" class="search-results" style="margin-top:12px"></div></div><div class="card"><h2>Learning tip</h2><p>Start with Month 1 if a topic feels confusing. Strong computer and networking basics make cybersecurity easier.</p></div>`;

 }

function visualFor(title,notes){
 const s=title.toLowerCase();let steps;
 if(s.includes('computer'))steps=['Input','Processing','Storage','Output'];
 else if(s.includes('network')||s.includes('ip')||s.includes('dns')||s.includes('tcp')||s.includes('web'))steps=['Your device','Router / network','Internet / server','Response'];
 else if(s.includes('python')||s.includes('syntax')||s.includes('loop')||s.includes('function')||s.includes('file'))steps=['Input','Code / logic','Test result','Improve'];
 else if(s.includes('incident')||s.includes('soc')||s.includes('log')||s.includes('siem'))steps=['Collect events','Detect signal','Investigate','Respond'];
 else if(s.includes('cloud'))steps=['Identity','Configuration','Data','Monitoring'];
 else if(s.includes('risk')||s.includes('threat')||s.includes('vulnerab'))steps=['Asset','Threat / weakness','Risk','Control'];
 else steps=['Understand','Observe safely','Practise with examples','Review'];
 return steps.map((x,i)=>(i?'<span class="arrow">→</span>':'')+`<span class="flowstep" style="animation-delay:${i*90}ms">${esc(x)}</span>`).join('');
}
function lessonTable(title,notes){
 const short=notes.length>150?notes.slice(0,147)+'…':notes;
 return `<table class="lesson-table"><thead><tr><th>Part</th><th>Simple meaning</th><th>Remember</th></tr></thead><tbody><tr><td><b>Topic</b></td><td>${esc(title)}</td><td>Know the definition.</td></tr><tr><td><b>Explanation</b></td><td>${esc(short)}</td><td>Explain in your own words.</td></tr><tr><td><b>Practice</b></td><td>${esc(practiceFor(state.currentMonth,state.currentTopic))}</td><td>Use your own device or an authorised lab.</td></tr></tbody></table>`;
}
function runAcademySearch(){
 const box=$('academySearch'),out=$('academySearchResults');if(!box||!out)return;
 const q=box.value.trim().toLowerCase();
 if(!q){out.innerHTML='<p class="small">Type a topic or keyword to find lessons.</p>';return;}
 let hits=[];modules.forEach((m,mi)=>m.topics.forEach((t,ti)=>{if((m.title+' '+t.title+' '+t.notes).toLowerCase().includes(q))hits.push({m,mi,t,ti});}));
 out.innerHTML=hits.length?hits.map(h=>`<div class="question"><b>${esc(h.t.title)}</b><p class="small">${esc(h.m.title)} — ${esc(h.t.notes)}</p><button onclick="openMonth(${h.mi});openTopic(${h.ti})">Open lesson</button></div>`).join(''):'<p>No matches. Try “network” or “Python”.</p>';
}
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
async function installAcademy(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;}else{alert('To install, open the hosted site in Chrome/Edge and use the browser menu → Install app or Add to Home screen. HTTPS hosting is required.');}}

function hindiExplain(title,notes){let simple=hindiNotes[title]||'Is topic ko dhyaan se padhein aur apni notebook mein apne shabdon mein likhein.';return `Aaj ka topic hai ${title}. Aasaan Hindi mein: ${simple} Ab is concept ko notebook mein likhiye, ek example banaiye, aur bina dekhe samjhaane ki koshish kijiye.`}
function speakText(text){stopSpeech();if(!('speechSynthesis'in window)){alert('Your browser does not support text-to-speech. You can still read the Hindi script.');return}speech=new SpeechSynthesisUtterance(text);speech.lang='hi-IN';speech.rate=0.86;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase().startsWith('hi'));if(v)speech.voice=v;speechSynthesis.speak(speech)}
function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function listVoices(){let vs=speechSynthesis.getVoices();$('voiceInfo').textContent=vs.filter(v=>v.lang.toLowerCase().startsWith('hi')).map(v=>v.name+' ('+v.lang+')').join(', ')||'No Hindi voice detected. Check your device/browser language and text-to-speech settings.'}
function selectedVideo(){let [m,t]=$('videoPick').value.split('-').map(Number);return {m,t,topic:modules[m].topics[t]}}
function slideData(){let s=selectedVideo();return [{h:s.topic.title,p:'Is lesson mein hum ek basic concept ko samjhenge.'},{h:'Simple explanation',p:s.topic.notes},{h:'Hindi mein samjhein',p:hindiExplain(s.topic.title,s.topic.notes)},{h:'Practice',p:practiceFor(s.m,s.t)},{h:'Revision',p:'Ab apne shabdon mein definition likhiye aur teen sawalon ke jawab dijiye.'}]}
function setSlide(i){slideIndex=i;renderSlide()}
function renderSlide(){if(!$('slide'))return;let ss=slideData();slideIndex=Math.max(0,Math.min(slideIndex,ss.length-1));$('slide').innerHTML=`<span class="tag">SLIDE ${slideIndex+1} / ${ss.length}</span><h2>${esc(ss[slideIndex].h)}</h2><p>${esc(ss[slideIndex].p)}</p>`;$('slideCount').textContent=`Slide ${slideIndex+1} of ${ss.length}`}
function startNarrated(){let s=selectedVideo();slideIndex=0;renderSlide();speakText(slideData().map(x=>x.h+'. '+x.p).join('. '))}
function nextSlide(){slideIndex++;renderSlide()}function prevSlide(){slideIndex--;renderSlide()}
function practiceFor(m,t){if(m===0)return 'On your laptop, identify two hardware parts and two software programs. Create a folder called Cybersecurity Academy and inside it create Month 1.';if(m===1)return 'Draw a simple network: laptop → Wi-Fi router → internet. Label what each part does. Do not scan a real network.';if(m===2)return 'Open your file manager and practise creating, renaming, and organising a practice folder. Read commands before using them.';if(m===3)return 'Write a tiny Python program using made-up values, then explain each line. Never collect real passwords or private data.';if(m===5)return 'Use the sample log in the Safe Practice Lab and count failed events. Explain why logs need context.';return 'Write a short checklist for this topic and practise only with example data or an authorised lab.'}
function saveLessonNote(m,t){state.notes[key(m,t)]=$('lessonNote').value;save();alert('Lesson notes saved in this browser.')}
function downloadLessonNote(m,t){let text=`${modules[m].title}\n${modules[m].topics[t].title}\n\n${$('lessonNote').value}`;downloadText('lesson-notes.txt',text)}
function saveQuickNote(){let title=$('noteTitle').value.trim()||'Quick note';let k='quick-'+Date.now();state.notes[k]=title+'\n'+$('quickNote').value;save();render()}
function editNote(k){let v=state.notes[k]||'';let nv=prompt('Edit note:',v);if(nv!==null){state.notes[k]=nv;save();render()}}
function noteLabel(k){if(k.startsWith('quick-'))return 'Quick note';let [m,t]=k.split('-').map(Number);return modules[m]?.title+' — '+modules[m]?.topics[t]?.title}
function markDone(m,t){state.done[key(m,t)]=$('doneBox').checked;save();render()}
function prevTopic(){if(state.currentTopic>0)state.currentTopic--;else if(state.currentMonth>0){state.currentMonth--;state.currentTopic=modules[state.currentMonth].topics.length-1}save();render()}
function nextTopic(){if(state.currentTopic<modules[state.currentMonth].topics.length-1)state.currentTopic++;else if(state.currentMonth<modules.length-1){state.currentMonth++;state.currentTopic=0}save();render()}
function gradeQuiz(e){e.preventDefault();let qs=window.quizData,score=0,details=qs.map((q,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`);let ok=a&&Number(a.value)===q[2];if(ok)score++;return `<div class="question"><b>${i+1}. ${ok?'Correct ✓':'Review this'}</b><p>${esc(q[3])}</p></div>`}).join('');$('quizResult').innerHTML=`<div class="card"><h2>Your score: ${score}/${qs.length}</h2><div class="bar"><i style="width:${score/qs.length*100}%"></i></div>${details}</div>`;state.quiz.last={score,total:qs.length,date:new Date().toISOString()};save();return false}
function showFlash(){if(!$('flashText'))return;let c=window.flashcards[window.flashIndex];$('flashText').innerHTML=`<div><span class="tag">CARD ${window.flashIndex+1}</span><h2>${esc(c[0])}</h2><p class="small">Think of the meaning, then reveal the answer.</p></div>`;$('flashCount').textContent=`${window.flashIndex+1} of ${window.flashcards.length}`}
function flipFlash(){let c=window.flashcards[window.flashIndex];$('flashText').innerHTML=`<div><h2>${esc(c[0])}</h2><p>${esc(c[1])}</p></div>`}
function moveFlash(d){window.flashIndex=(window.flashIndex+d+window.flashcards.length)%window.flashcards.length;showFlash()}
function filterGlossary(){let q=$('glossSearch').value.toLowerCase();document.querySelectorAll('.gloss').forEach(e=>e.classList.toggle('hide',!e.innerText.toLowerCase().includes(q)))}
function exportBackup(){downloadText('cybersecurity-academy-backup.json',JSON.stringify(state,null,2))}
function downloadText(name,txt){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function startTimer(min){stopTimer();let end=Date.now()+min*60000;window._timer=setInterval(()=>{let left=Math.max(0,end-Date.now()),m=Math.floor(left/60000),s=Math.floor(left%60000/1000);if($('timer'))$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left===0){stopTimer();if($('timerMsg'))$('timerMsg').textContent='Session complete. Take a short break!';}},250);if($('timerMsg'))$('timerMsg').textContent='Focus session running.'}
function stopTimer(){if(window._timer)clearInterval(window._timer);window._timer=null;if($('timer'))$('timer').textContent='25:00';if($('timerMsg'))$('timerMsg').textContent='Timer stopped.'}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script></body></html>
